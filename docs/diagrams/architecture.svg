<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="500" viewBox="0 0 1040 500" role="img" aria-labelledby="title desc">
<title id="title">Архитектура Cross-Team Matcher</title><desc id="desc">Три приложения подключаются к собственным узлам PostgreSQL. Каталог из центра реплицируется в регионы, рабочие данные регионов — друг другу и в центр. FDW обслуживает основные записи.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#a34d32"/></marker></defs>
<rect width="1040" height="500" fill="#f7f5ef"/>
<g font-family="Arial,sans-serif" fill="#24332f"><text x="40" y="42" font-size="24" font-weight="bold">Одно приложение · три независимых владельца</text>
<g fill="white" stroke="#c8c9bf"><rect x="40" y="82" width="280" height="82" rx="12"/><rect x="380" y="82" width="280" height="82" rx="12"/><rect x="720" y="82" width="280" height="82" rx="12"/></g>
<g font-size="22" text-anchor="middle"><text x="180" y="116">Приложение R1</text><text x="520" y="116">Приложение C</text><text x="860" y="116">Приложение R2</text></g>
<g font-size="14" text-anchor="middle"><text x="180" y="143">Профили · проекты · согласия</text><text x="520" y="143">Каталог · аналитика</text><text x="860" y="143">Профили · проекты · согласия</text></g>
<g stroke="#a34d32" stroke-width="2" marker-end="url(#arrow)"><path d="M180 170V216"/><path d="M520 170V216"/><path d="M860 170V216"/></g>
<g font-size="13"><text x="193" y="197">один DSN</text><text x="533" y="197">один DSN</text><text x="873" y="197">один DSN</text></g>
<g fill="#24332f"><rect x="40" y="225" width="280" height="145" rx="12"/><rect x="380" y="225" width="280" height="145" rx="12"/><rect x="720" y="225" width="280" height="145" rx="12"/></g>
<g fill="white" text-anchor="middle"><g font-size="22"><text x="180" y="260">PostgreSQL R1</text><text x="520" y="260">PostgreSQL C</text><text x="860" y="260">PostgreSQL R2</text></g><g font-size="14"><text x="180" y="291">Основные R1 · копии R2</text><text x="180" y="315">global · search · private</text><text x="180" y="340">закрытые сведения только здесь</text><text x="520" y="291">Основной каталог</text><text x="520" y="315">Копии R1 + R2 для аналитики</text><text x="520" y="340">cat · analytics · private</text><text x="860" y="291">Основные R2 · копии R1</text><text x="860" y="315">global · search · private</text><text x="860" y="340">закрытые сведения только здесь</text></g></g>
<g stroke="#a34d32" stroke-width="2" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"><path d="M327 287H374"/><path d="M666 287H714"/><path d="M180 377V422H860V377"/></g>
<g font-size="14" text-anchor="middle"><text x="520" y="403">R1 ↔ R2 напрямую: рабочие копии и FDW к владельцам</text><text x="520" y="456">C → регионы: каталог · регионы → C: рабочие данные</text><text x="520" y="480">Поиск читает копии. Назначение подтверждается только на владельце сотрудника.</text></g></g></svg>
